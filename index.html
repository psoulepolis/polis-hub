button,input,select,textarea{font:inherit;color:inherit}

.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

<script>
(function(){
// ---------- constantes ----------
const SIT_T={pendente:'Pendente',andamento:'Em execução',devolvida:'Devolvida',conferencia:'Aguardando conferência',concluida:'Concluída'};
const SIT_SHORT={pendente:'Pend.',andamento:'Exec.',devolvida:'Devolv.',conferencia:'Confer.',concluida:'Concl.'};
const SIT_T_ORD=['pendente','andamento','devolvida','conferencia','concluida'];
const SIT_P={aguardando:'Aguardando prazo',andamento:'Em andamento',parado:'Parado',finalizado:'Finalizado'};
const PRIO={1:'Urgente',2:'Alta',3:'Normal',4:'Baixa'};
const WD=['D','S','T','Q','Q','S','S'];
const WDL=['dom','seg','ter','qua','qui','sex','sáb'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DEF_DAYS=[1,2,3,4,5];
const DISC_SIG={'Água':'AGU','Esgoto':'ESG','Drenagem':'DRE','Terraplenagem':'TER','Pavimentação':'PAV','Sinalização':'SIN','RIT':'RIT','EIV':'EIV'};
const stripAc=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sugSigla=n=>stripAc(n).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
const sugEmpSigla=n=>stripAc(n).split(/\s+/).filter(w=>w.length>2&&!/^(dos|das|del)$/i.test(w)).map(w=>w[0]).join('').slice(0,3).toUpperCase();

// ---------- datas ----------
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{if(!s)return null;const[a,b,c]=s.slice(0,10).split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addI=(s,n)=>iso(addD(parse(s),n));
const diffD=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const br=s=>{if(!s)return '—';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const brY=s=>{if(!s)return '—';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const brTs=s=>s?brY(s.slice(0,10))+(s.length>10?' '+s.slice(11,16):''):'—';
let TODAY=iso(new Date());
const monday=s=>{const x=parse(s);return iso(addD(x,-((x.getDay()+6)%7)))};
const nowStamp=()=>{const d=new Date();return iso(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function wdBetween(a,b,days){if(!a||!b)return 0;let n=0,d=parse(a),e=parse(b);if(e<d)return 0;let g=0;
  while(d<=e&&g++<2000){if(days.includes(d.getDay()))n++;d=addD(d,1)}return n}
function addWd(start,n,days){let d=parse(start),c=0,g=0;if(!days.length)days=DEF_DAYS;while(g++<800){if(days.includes(d.getDay())){c++;if(c>=n)return iso(d)}d=addD(d,1)}return iso(d)}
function latestStart(prazo,n,days){let d=parse(prazo),c=0,g=0;if(!days.length)days=DEF_DAYS;while(g++<800){if(days.includes(d.getDay())){c++;if(c>=n)return iso(d)}d=addD(d,-1)}return iso(d)}

// ---------- armazenamento na pasta de dados (compartilhada) ----------
/* Cada computador grava só o seu arquivo em alteracoes/<computador>.json.
   O app lê os arquivos de todos e junta as alterações por ordem de horário.
   Uma vez por dia, um coordenador consolida tudo em base.json e grava um backup. */
let S={me:'',users:[],clientes:[],emps:[],discs:[],tipos:[],modelos:[],projetos:[],tarefas:[]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const COLS=['users','clientes','emps','discs','tipos','modelos','projetos','tarefas'];
const COLAB_SIT={pendente:['pendente','andamento'],devolvida:['devolvida','andamento'],andamento:['andamento','conferencia'],conferencia:['conferencia'],concluida:['concluida']};
const COLAB_TASK_KEYS=['onde','pend','iniReal','fimExec','sit','atualEm','atualPor'];
const emptyData=()=>{const d={};COLS.forEach(c=>d[c]=[]);return d};
let DATA=emptyData(),BASE=null,BASEMETA=null,EVCACHE={},MY=[],MYSEQ=0,MYDIRTY=false,DEVICE='',MARK=null;
let SNAP={},busy=false,again=false,pendingRender=false,maintDay='';
const FS={locs:[],cur:-1,status:'init',busy:false,lastSave:0,locStatus:{},writing:false,writeAgain:false};
const jstr=r=>JSON.stringify(r,(k,v)=>(k&&k[0]==='_')?undefined:v);
const hk=h=>h.ts+'|'+h.u+'|'+h.k+'|'+h.txt;
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('polis-hub',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}},
  async set(k,v){try{const db=await this.open();return await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})}catch(e){return false}}};
const saveMy=()=>idb.set('my:'+DEVICE,{seq:MYSEQ,events:MY,dirty:MYDIRTY});

// senhas (PBKDF2, no próprio navegador)
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbk(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pw)),'PBKDF2',false,['deriveBits']);
  return b2h(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:h2b(salt),iterations:it},k,256))}
async function hashPw(pw){const salt=b2h(crypto.getRandomValues(new Uint8Array(16)));const it=150000;return 'pbkdf2$'+it+'$'+salt+'$'+await pbk(pw,salt,it)}
async function checkPw(pw,st){if(!st)return false;const p=st.split('$');if(p.length!==4)return false;return (await pbk(pw,p[2],+p[1]))===p[3]}

// ---- junção das alterações
const onlyKeys=(o,keys)=>!o||Object.keys(o).every(k=>keys.includes(k));
function allowed(e,idx){
  const u=idx.users.get(e.u);
  if(!u){ // configuração inicial ou pedido de acesso
    if(e.c!=='users'||e.id!==e.u||e.op!=='put')return false;
    if(!idx.users.size)return true;
    return !idx.users.has(e.id)&&e.set&&e.set.status==='pendente'&&e.set.perfil==='colab';
  }
  if(u.perfil==='coord'&&u.status==='ativo')return true;
  if(e.c==='users')return e.id===e.u&&e.op==='put'&&onlyKeys(e.set,['hash'])&&!e.unset;
  if(u.status!=='ativo'||e.c!=='tarefas'||e.op==='del')return false;
  const t=idx.tarefas.get(e.id);if(!t||t.resp!==e.u||t.sit==='concluida')return false;
  if(!onlyKeys(e.set,COLAB_TASK_KEYS)||(e.unset&&!e.unset.every(k=>COLAB_TASK_KEYS.includes(k))))return false;
  if(e.set&&'sit' in e.set&&!(COLAB_SIT[t.sit]||[]).includes(e.set.sit))return false;
  return true;
}
function applyEv(e,idx,deleted){
  const m=idx[e.c];if(!m)return;const key=e.c+':'+e.id;
  if(e.op==='del'){m.delete(e.id);deleted.add(key);return}
  if(deleted.has(key))return;
  let r=m.get(e.id);if(!r){r={id:e.id};m.set(e.id,r)}
  if(e.set)for(const k in e.set)if(k!=='id')r[k]=e.set[k];
  if(e.unset)e.unset.forEach(k=>{if(k!=='id')delete r[k]});
  if(e.hist&&e.hist.length){r.hist=Array.isArray(r.hist)?r.hist:[];const seen=new Set(r.hist.map(hk));
    e.hist.forEach(h=>{const k=hk(h);if(!seen.has(k)){r.hist.push(h);seen.add(k)}});r.hist.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0)}
}
function rebuild(){
  const d=BASE&&BASE.data?JSON.parse(JSON.stringify(BASE.data)):emptyData();
  COLS.forEach(c=>{if(!Array.isArray(d[c]))d[c]=[]});
  const asOf=(BASE&&BASE.asOf)||{};const evs=[];
  for(const [w,f] of Object.entries(EVCACHE))if(w!==DEVICE)(f.events||[]).forEach(e=>{if((e.seq|0)>(asOf[w]|0))evs.push(e)});
  MY.forEach(e=>{if(e.seq>(asOf[DEVICE]|0))evs.push(e)});
  evs.sort((a,b)=>(a.ts-b.ts)||(a.w<b.w?-1:a.w>b.w?1:0)||(a.seq-b.seq));
  const idx={};COLS.forEach(c=>idx[c]=new Map(d[c].map(r=>[r.id,r])));
  const deleted=new Set();
  for(const e of evs){try{if(allowed(e,idx))applyEv(e,idx,deleted)}catch(x){}}
  COLS.forEach(c=>d[c]=[...idx[c].values()]);
  DATA=d;
}
function snapAll(){SNAP={};COLS.forEach(c=>{SNAP[c]={};S[c].forEach(r=>SNAP[c][r.id]=jstr(r))})}
function clearView(){S.me='';COLS.forEach(c=>S[c]=[]);snapAll()}
function buildView(){
  const u=DATA.users.find(x=>x.id===S.me);const coord=u&&u.perfil==='coord'&&u.status==='ativo';
  const v={};COLS.forEach(c=>v[c]=DATA[c]);
  if(!coord){v.tarefas=DATA.tarefas.filter(t=>t.resp===S.me);const ps=new Set(v.tarefas.map(t=>t.proj));v.projetos=DATA.projetos.filter(p=>ps.has(p.id));v.users=DATA.users.filter(x=>x.status==='ativo')}
  COLS.forEach(c=>S[c]=JSON.parse(JSON.stringify(v[c])));
  S.users.forEach(x=>delete x.hash);
  snapAll();
}
function diffEvents(){
  const evs=[];
  COLS.forEach(c=>{const seen=new Set();
    S[c].forEach(r=>{seen.add(r.id);const sj=jstr(r);const old=SNAP[c][r.id];if(old===sj)return;
      const o=old?JSON.parse(old):{},n=JSON.parse(sj),set={},unset=[];
      for(const k in n){if(k==='hist'||k==='id')continue;if(JSON.stringify(n[k])!==JSON.stringify(o[k]))set[k]=n[k]}
      for(const k in o){if(k!=='hist'&&k!=='id'&&!(k in n))unset.push(k)}
      const ohs=new Set((o.hist||[]).map(hk));const hist=(n.hist||[]).filter(h=>!ohs.has(hk(h)));
      evs.push({c,id:r.id,op:'put',set,unset,hist,_s:sj})});
    Object.keys(SNAP[c]).forEach(id=>{if(!seen.has(id))evs.push({c,id,op:'del'})})});
  return evs;
}
async function emit(evs,u){
  evs=evs.filter(e=>e.op==='del'||(e.set&&Object.keys(e.set).length)||(e.unset&&e.unset.length)||(e.hist&&e.hist.length));
  if(!evs.length)return;
  const ts=Date.now();
  evs.forEach(e=>{e.w=DEVICE;e.seq=++MYSEQ;e.ts=ts;e.u=u;if(e.set&&!Object.keys(e.set).length)delete e.set;if(!e.unset||!e.unset.length)delete e.unset;if(!e.hist||!e.hist.length)delete e.hist;MY.push(e)});
  MYDIRTY=true;await saveMy();rebuild();setSync();writeMine();
}
async function save(){
  if(!S.me)return;
  if(busy){again=true;return}
  const evs=diffEvents();if(!evs.length)return;
  busy=true;
  try{
    for(const e of evs){
      if(e.c==='users'&&e.op==='put'){const pw=e.set.novaSenha||e.set.senha;delete e.set.novaSenha;delete e.set.senha;e.unset=e.unset.filter(k=>k!=='senha'&&k!=='novaSenha');
        if(pw)e.set.hash=await hashPw(pw);
        const r=S.users.find(x=>x.id===e.id);if(r){delete r.senha;delete r.novaSenha}
        const o=JSON.parse(e._s);delete o.senha;delete o.novaSenha;e._s=jstr(o)}
    }
    evs.forEach(e=>{if(e.op==='del')delete SNAP[e.c][e.id];else SNAP[e.c][e.id]=e._s;delete e._s});
    await emit(evs,S.me);
  }finally{busy=false}
  if(again){again=false;save()}
}

// ---- arquivos
const curDir=()=>FS.cur>=0&&FS.locs[FS.cur]?FS.locs[FS.cur].h:null;
async function writeText(dir,name,txt){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(txt);await w.close()}
async function readJSON(dir,name){let f;try{f=await (await dir.getFileHandle(name)).getFile()}catch(e){if(e&&e.name==='NotFoundError')return null;throw e}
  return {j:JSON.parse(await f.text()),m:f.lastModified,s:f.size}}
function fsFail(e){
  const was=FS.status;
  if(e&&e.name==='NotAllowedError')FS.status='ask';else{FS.status='offline';const l=FS.locs[FS.cur];if(l)FS.locStatus[l.id]='off'}
  FS.cur=-1;setSync();
  if(was==='ok'&&S.me)toast(FS.status==='ask'?'O navegador pediu para reconectar a pasta. Clique no aviso no topo.':'Sem acesso à pasta de dados. Pode continuar: as alterações ficam guardadas neste computador.');
}
async function writeMine(){
  const dir=curDir();if(!dir||FS.status!=='ok'){setSync();return}
  if(FS.writing){FS.writeAgain=true;return}
  FS.writing=true;setSync();
  try{const ad=await dir.getDirectoryHandle('alteracoes',{create:true});const n=MY.length;
    await writeText(ad,DEVICE+'.json',JSON.stringify({w:DEVICE,events:MY}));
    FS.lastSave=Date.now();if(MY.length===n&&!FS.writeAgain){MYDIRTY=false;saveMy()}}
  catch(e){FS.writing=false;fsFail(e);return}
  FS.writing=false;
  if(FS.writeAgain){FS.writeAgain=false;return writeMine()}
  setSync();
}
async function refresh(force){
  const dir=curDir();if(!dir)return false;let ch=false;
  let b;try{b=await readJSON(dir,'base.json')}catch(e){if(e instanceof SyntaxError)b='bad';else throw e}
  if(b==='bad'){}else if(!b){if(BASE){BASE=null;BASEMETA=null;ch=true}}
  else if(force||!BASEMETA||b.m!==BASEMETA.m||b.s!==BASEMETA.s){BASE=b.j;BASEMETA={m:b.m,s:b.s};ch=true}
  const ad=await dir.getDirectoryHandle('alteracoes',{create:true});const seen=new Set();
  for await(const [n,h] of ad.entries()){
    if(h.kind!=='file'||!/^[\w-]+\.json$/.test(n))continue;const w=n.slice(0,-5);if(w===DEVICE)continue;seen.add(w);
    const f=await h.getFile();const c=EVCACHE[w];if(!force&&c&&c.m===f.lastModified&&c.s===f.size)continue;
    try{const j=JSON.parse(await f.text());EVCACHE[w]={m:f.lastModified,s:f.size,events:Array.isArray(j.events)?j.events:[]};ch=true}catch(e){}
  }
  for(const w of Object.keys(EVCACHE))if(!seen.has(w)){delete EVCACHE[w];ch=true}
  if(ch){
    rebuild();idb.set('cache:'+DEVICE,{base:BASE,ev:EVCACHE,mark:MARK});
    const lim=(BASE&&BASE.asOf&&BASE.asOf[DEVICE])|0;
    if(lim&&MY.some(e=>e.seq<=lim)){MY=MY.filter(e=>e.seq>lim);MYDIRTY=true;await saveMy();writeMine()}
  }
  return ch;
}
async function permissao(h,ask){try{let p=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';if(p!=='granted'&&ask)p=await h.requestPermission({mode:'readwrite'});return p}catch(e){return 'prompt'}}
async function fsConnect(ask){
  if(FS.busy)return;FS.busy=true;
  try{let perm=false;
    for(let i=0;i<FS.locs.length;i++){const l=FS.locs[i];const p=await permissao(l.h,ask);
      if(p!=='granted'){FS.locStatus[l.id]='perm';perm=true;continue}
      try{await l.h.getDirectoryHandle('alteracoes',{create:true})}catch(e){FS.locStatus[l.id]='off';continue}
      FS.locStatus[l.id]='ok';FS.cur=i;FS.status='ok';
      for(let j=i+1;j<FS.locs.length;j++)delete FS.locStatus[FS.locs[j].id];
      try{await afterConnect()}catch(e){fsFail(e)}
      return}
    FS.cur=-1;FS.status=perm?'ask':'offline';
  }finally{FS.busy=false;setSync()}
}
async function afterConnect(){
  const dir=curDir();
  let mk=null;try{mk=await readJSON(dir,'polis-hub.json')}catch(e){if(!(e instanceof SyntaxError))throw e}
  if(mk&&mk.j&&mk.j.app==='polis-hub')MARK=mk.j;
  else{MARK={app:'polis-hub',id:uid('b'),criadoEm:nowStamp()};await writeText(dir,'polis-hub.json',JSON.stringify(MARK,null,1))}
  const ad=await dir.getDirectoryHandle('alteracoes',{create:true});
  let own=null;try{own=await readJSON(ad,DEVICE+'.json')}catch(e){}
  if(own&&own.j&&Array.isArray(own.j.events)){
    const have=new Set(MY.map(e=>e.seq));let add=false;
    own.j.events.forEach(e=>{if(!have.has(e.seq)){MY.push(e);add=true}});
    if(add){MY.sort((a,b)=>a.seq-b.seq);MYSEQ=Math.max(MYSEQ,...MY.map(e=>e.seq));await saveMy()}
    if(own.j.events.length!==MY.length)MYDIRTY=true;
  }else if(MY.length)MYDIRTY=true;
  await refresh(true);
  if(MYDIRTY)await writeMine();
}
async function maintenance(){
  if(!S.me||!isCoord()||FS.status!=='ok')return;
  const day=iso(new Date());if(maintDay===day||(BASE&&BASE.day===day))return;maintDay=day;
  try{const dir=curDir();await refresh(true);
    const asOf=Object.assign({},(BASE&&BASE.asOf)||{});
    for(const [w,f] of Object.entries(EVCACHE))asOf[w]=Math.max(asOf[w]|0,...(f.events||[]).map(e=>e.seq|0));
    asOf[DEVICE]=Math.max(asOf[DEVICE]|0,MYSEQ);
    const nb={app:'polis-hub',day,savedAt:Date.now(),asOf,data:DATA};const txt=JSON.stringify(nb);
    const bd=await dir.getDirectoryHandle('backups',{create:true});const name='polis-hub-'+day+'.json';
    let ex=true;try{await bd.getFileHandle(name)}catch(e){ex=false}
    if(!ex){await writeText(bd,name,txt);const ns=[];for await(const [n,h] of bd.entries())if(h.kind==='file'&&/^polis-hub-\d{4}-\d{2}-\d{2}\.json$/.test(n))ns.push(n);
      ns.sort();for(const n of ns.slice(0,Math.max(0,ns.length-60)))await bd.removeEntry(n)}
    let cur=null;try{cur=await readJSON(dir,'base.json')}catch(e){}
    if(cur&&cur.j&&Object.keys(cur.j.asOf||{}).some(w=>(cur.j.asOf[w]|0)>(asOf[w]|0)))return;
    await writeText(dir,'base.json',txt);BASE=nb;BASEMETA=null;
    if(MY.length){MY=MY.filter(e=>e.seq>asOf[DEVICE]);MYDIRTY=true;await saveMy();writeMine()}
  }catch(e){maintDay=''}
}
function setSync(){
  const el=document.getElementById('syncTag');if(!el)return;
  let t='',cls='sync',act=false;const ln=FS.cur>=0&&FS.locs[FS.cur]?FS.locs[FS.cur].nome:'';
  if(FS.status==='ok'){if(FS.writing||MYDIRTY){t='Salvando…';cls+=' saving'}else t=(FS.lastSave?'Salvo · '+new Date(FS.lastSave).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Conectado')+(FS.locs.length>1&&ln?' · '+ln:'')}
  else if(FS.status==='ask'){t='Clique para reconectar a pasta';cls+=' off act';act=true}
  else if(FS.status==='offline'){t=MYDIRTY?'Sem acesso à pasta · alterações guardadas neste computador':'Sem acesso à pasta';cls+=' off act';act=true}
  const lf=document.getElementById('loginFolder');
  if(lf){const ok=FS.status==='ok';lf.innerHTML='<span style="color:'+(ok?'var(--ok)':'var(--bad)')+'">●</span> '+(ok?'Pasta de dados conectada'+(ln?' · '+esc(ln):''):FS.status==='ask'?'<b>Pasta de dados precisa ser reconectada.</b> Clique em “Pasta de dados” → Reconectar.':'<b>Sem acesso à pasta de dados.</b> Confira a rede ou o RaiDrive, ou adicione outro caminho em “Pasta de dados”.')}
  el.className=cls;el.textContent=t;el.title=act?'Clique para tentar reconectar':(ln?'Pasta de dados: '+ln:'');
  el.onclick=act?async()=>{await fsConnect(true);if(FS.status==='ok'){toast('Pasta reconectada');poll()}}:null;
}
const dialogOpen=()=>document.getElementById('dlg').open||document.getElementById('dlg2').open;
const focusedInput=()=>{const ae=document.activeElement;return !!(ae&&ae.matches&&ae.matches('input,textarea,select'))&&!!ae.closest('#main')};
const getSess=()=>{try{return JSON.parse(localStorage.getItem('polishub:sess:'+DEVICE)||'null')}catch(e){return null}};
const setSess=u=>{try{if(u)localStorage.setItem('polishub:sess:'+DEVICE,JSON.stringify({uid:u.id,hk:(u.hash||'').slice(-16)}));else localStorage.removeItem('polishub:sess:'+DEVICE)}catch(e){}};
function userStillValid(){const u=DATA.users.find(x=>x.id===S.me);const s=getSess();return !!(u&&u.status==='ativo'&&s&&s.uid===u.id&&(u.hash||'').slice(-16)===s.hk)}
async function poll(){
  if(FS.status==='offline'&&FS.locs.length&&!FS.busy){await fsConnect(false);if(FS.status==='ok')pendingRender=true}
  if(FS.status!=='ok'||busy)return;
  const t=iso(new Date());if(t!==TODAY){TODAY=t;pendingRender=true}
  if(S.me&&diffEvents().length){save();return}
  if(MYDIRTY&&!FS.writing)writeMine();
  let ch=false;try{ch=await refresh(false)}catch(e){fsFail(e);return}
  if(!S.me)return;
  if(ch)pendingRender=true;
  maintenance();
  if(pendingRender&&!dialogOpen()&&!focusedInput()){pendingRender=false;
    if(!userStillValid())return logout('Seu acesso foi alterado. Entre de novo.');
    buildView();render()}
}
setInterval(poll,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('focus',()=>poll());



// ---------- acesso a dados ----------
const byId=(arr,id)=>arr.find(x=>x.id===id);
const U=id=>byId(S.users,id);
const PR=id=>byId(S.projetos,id);
const CL=id=>byId(S.clientes,id);
const EM=id=>byId(S.emps,id);
const DI=id=>byId(S.discs,id);
const TI=id=>byId(S.tipos,id);
const me=()=>U(S.me)||S.users[0];
const isCoord=()=>me().perfil==='coord'&&me().status==='ativo';
const ativos=()=>S.users.filter(u=>u.status==='ativo');
const uname=id=>U(id)?.nome||'—';
const ini2=n=>(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();

  if(PAINEL.view==='projetos')h+=projKanban();else h+=taskKanban();

function taskCard(t,showWho){
  const p=PR(t.proj),e=p&&EM(p.emp);const venc=tVencida(t);const mine=t.resp===S.me;
  let acts='';
  if(mine&&(t.sit==='pendente'))acts='<button class="btn sm primary" data-act="start" data-id="'+t.id+'">Iniciar</button>';
  if(mine&&t.sit==='devolvida')acts='<button class="btn sm primary" data-act="start" data-id="'+t.id+'">Retomar</button>';
  if(mine&&t.sit==='andamento')acts='<button class="btn sm" data-act="onde" data-id="'+t.id+'">Onde parei</button><button class="btn sm conf" data-act="send" data-id="'+t.id+'">Enviar p/ conferência</button>';
  if(isCoord()&&t.sit==='conferencia')acts='<button class="btn sm conf" data-open="'+t.id+'">Conferir</button>';
  const lastDev=t.sit==='devolvida'?[...t.hist].reverse().find(x=>x.k==='devolucao'):null;
  return '<div class="kcard" tabindex="0" role="button" data-open="'+t.id+'" style="--edge:'+prioVar(t.prio)+'">'+
    '<div class="r"><span class="sw" style="background:'+cliVar(p?.cli)+'" title="'+esc(CL(p?.cli)?.nome)+'"></span><span class="small mono muted" style="margin-right:auto">'+esc(p?.codigo||'')+' · '+esc(DI(p?.disc)?.nome||'')+'</span>'+prioPill(t.prio)+'</div>'+
    '<div class="t">'+esc(t.titulo)+'</div>'+
    '<div class="m">'+esc(e?.nome||'')+' · '+esc(CL(p?.cli)?.nome||'')+'</div>'+
    (lastDev?'<div class="q" style="border-left-color:var(--s-devolvida);color:var(--s-devolvida)">'+esc(lastDev.det)+'</div>':t.onde&&t.sit!=='concluida'?'<div class="q">'+esc(t.onde)+'</div>':'')+
    '<div class="r"><span class="mono small'+(venc?'" style="color:var(--bad);font-weight:600':'')+'">'+(t.fim?'até '+br(t.fim):'sem data')+(venc?' · vencida':'')+'</span>'+(showWho?'<span class="small"><b>'+esc(uname(t.resp))+'</b></span>':'')+(showWho?'':sitPill(t.sit))+'</div>'+
    (acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
}
function taskKanban(){
  const coord=isCoord();let list=S.tarefas;
  const quem=coord?PAINEL.quem:'eu';
  if(quem==='eu')list=list.filter(t=>t.resp===S.me);else if(quem!=='todos')list=list.filter(t=>t.resp===quem);
  const cols=[['pendente','Pendentes'],['andamento','Em execução'],['devolvida','Devolvidas para correção'],['conferencia','Aguardando conferência'],['concluida','Concluídas (30 dias)']];
  const lim=addI(TODAY,-30);
  return '<div class="kwrap"><div class="kanban">'+cols.map(([s,l])=>{
    let L=list.filter(t=>t.sit===s);if(s==='concluida')L=L.filter(t=>(t.aprovEm||'').slice(0,10)>=lim);
    L.sort(sortT);
    return '<section class="kcol"><h4><i class="dot" style="background:'+sitVar(s)+'"></i>'+l+'<span class="c">'+L.length+'</span></h4>'+
      (L.length?L.map(t=>taskCard(t,quem!=='eu')).join(''):'<p class="small muted" style="margin:4px">Nada aqui.</p>')+'</section>'}).join('')+'</div></div>';
}
function projCard(p){

  let extra='';
  if(p.sit==='aguardando'&&p.fim&&p.est){const ls=latestStart(p.fim,+p.est,daysOf(p.resp));const fol=wdBetween(TODAY,ls,daysOf(p.resp))-1;
    extra='<div class="r"><span class="small">Começar até <b class="mono">'+br(ls)+'</b></span>'+(ls<TODAY?'<span class="pill bad">atrasado p/ começar</span>':fol<=5?'<span class="pill warn">folga '+Math.max(fol,0)+' d.u.</span>':'<span class="pill ok">folga '+fol+' d.u.</span>')+'</div>'}
  if(p.sit==='parado'&&p.motivo)extra='<div class="q" style="border-left-color:var(--warn)">'+esc(p.motivo)+'</div>';

    (ts.length?'<div class="r"><div class="prog" style="flex:1"><i style="width:'+(done/ts.length*100)+'%"></i></div><span class="small mono">'+done+'/'+ts.length+'</span>'+(conf?'<span class="pill" style="color:var(--s-conferencia)">'+conf+' p/ conferir</span>':'')+'</div>':'<div class="small muted">Sem tarefas</div>')+

function projKanban(){
  const cols=['aguardando','andamento','parado','finalizado'];

    const L=S.projetos.filter(p=>p.sit===s).sort((a,b)=>(a.fim||'9')<(b.fim||'9')?-1:1);
    return '<section class="kcol" data-drop="'+s+'"><h4>'+SIT_P[s]+'<span class="c">'+L.length+'</span></h4>'+(L.length?L.map(projCard).join(''):'<p class="small muted" style="margin:4px">Nenhum projeto.</p>')+'</section>'}).join('')+'</div></div>';

function bindCards(el){
  el.querySelectorAll('[data-open]').forEach(c=>{c.onclick=e=>{if(e.target.closest('[data-act]'))return;e.stopPropagation();openTask(c.dataset.open)};
    c.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===c){e.preventDefault();openTask(c.dataset.open)}}});
  el.querySelectorAll('[data-proj]').forEach(c=>{c.onclick=()=>openProj(c.dataset.proj);c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c)openProj(c.dataset.proj)}});
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=byId(S.tarefas,b.dataset.id);
    if(b.dataset.act==='start')doStart(t);
    else if(b.dataset.act==='send')openTask(t.id,null,'send');
    else if(b.dataset.act==='onde')openTask(t.id,null,'onde')});
}
function bindProjDrag(el){
  let dragId=null;
  el.querySelectorAll('[data-proj]').forEach(c=>{c.ondragstart=e=>{dragId=c.dataset.proj;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}});
  el.querySelectorAll('[data-drop]').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('over')};
    col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('over');const p=PR(dragId);const s=col.dataset.drop;if(!p||p.sit===s)return;
      if(s==='parado'){askMotivo(p);return}
      setProjSit(p,s);save();render();toast('Projeto movido para '+SIT_P[s])}});
}
function setProjSit(p,s,motivo){const old=p.sit;p.sit=s;if(s==='parado')p.motivo=motivo||p.motivo;
  if(s==='andamento'&&!p.ini)p.ini=TODAY;
  log(p,'situacao','Situação: '+SIT_P[old]+' → '+SIT_P[s],s==='parado'?p.motivo:'')}

      '<div class="f"><label for="tFimR">Conclusão da execução</label><input id="tFimR" type="date" value="'+t.fimExec+'" '+(canEditExec?'':'disabled')+'><span class="help">Preenchida ao enviar para conferência.</span></div>'+
      '</div>';
    if(t.aprovEm)h+='<p class="small" style="margin:10px 0 0">Aprovada por <b>'+esc(uname(t.aprovPor))+'</b> em '+brTs(t.aprovEm)+'.</p>';
    // ações
    let a='';
    if(canExec){
      if(t.sit==='pendente'||t.sit==='devolvida')a+='<button class="btn primary" type="button" id="aStart">'+(t.sit==='devolvida'?'Retomar execução':'Iniciar execução')+'</button>';
      if(t.sit==='andamento'||t.sit==='devolvida'||t.sit==='pendente')a+='<button class="btn" type="button" id="aSave">Salvar andamento</button>';
      if(t.sit==='andamento')a+='<button class="btn conf" type="button" id="aSend">Enviar para conferência</button>';
    }
    if(coord&&t.sit==='conferencia')a+='<button class="btn ok" type="button" id="aApprove">Aprovar e concluir</button><button class="btn danger" type="button" id="aReturn">Devolver para ajustes</button>';
    if(coord&&t.sit==='concluida')a+='<button class="btn" type="button" id="aReopen">Reabrir tarefa</button>';
    if(!coord&&t.sit==='conferencia')a+='<span class="small muted">Enviada para conferência. A coordenação vai aprovar ou devolver.</span>';
    if(a)h+='<div class="actions" style="margin-top:12px">'+a+'</div><div id="retZone"></div>';
    h+='</section>';
    // histórico
    h+='<section class="sec"><h4>Histórico</h4><ul class="hist">'+[...t.hist].reverse().map(x=>'<li class="k-'+x.k+'"><time>'+brTs(x.ts)+'</time><b>'+esc(uname(x.u))+'</b> — '+esc(x.txt)+(x.det?'<span class="tx">'+esc(x.det)+'</span>':'')+'</li>').join('')+'</ul></section>';
  }
  h+='</div><div class="dlg-f">';
  if(canPlan&&!isNew)h+='<span id="delZone"><button class="btn danger" type="button" id="tDel">Excluir</button></span>';
  h+='<span class="sp"></span><button class="btn" value="cancel">'+(canPlan?'Cancelar':'Fechar')+'</button>';
  if(canPlan&&isNew)h+='<button class="btn" type="button" id="tSaveNext">Salvar e criar outra</button>';
  if(canPlan)h+='<button class="btn primary" type="button" id="tSave">Salvar</button>';
  h+='</div>';
  f.innerHTML=h;
  const $=s=>f.querySelector(s);
  // planejamento: cálculos
  if(canPlan){
    const recalcFim=()=>{const i=$('#tIni').value,d=+$('#tDur').value;if(i&&d>0)$('#tFim').value=addWd(i,d,daysOf($('#tResp').value))};
    const recalcDur=()=>{const i=$('#tIni').value,e=$('#tFim').value;if(i&&e&&e>=i)$('#tDur').value=wdBetween(i,e,daysOf($('#tResp').value))};
    $('#tIni').onchange=recalcFim;$('#tDur').oninput=recalcFim;$('#tResp').onchange=recalcFim;$('#tFim').onchange=recalcDur;
    $('#tProj').onchange=()=>{const pp=PR($('#tProj').value);if(pp){$('#tCtx').textContent=(CL(pp.cli)?.nome||'')+' › '+(EM(pp.emp)?.nome||'')+' › '+projLabel(pp)+' · '+(DI(pp.disc)?.nome||'');}};
    if($('#tMod'))$('#tMod').onchange=()=>{const m=byId(S.modelos,$('#tMod').value);if(!m)return;$('#tTit').value=m.titulo;$('#tDesc').value=m.desc;$('#tDur').value=m.dur;
      if(!$('#tIni').value){const pp=PR($('#tProj').value);$('#tIni').value=nextFree($('#tResp').value)||TODAY}recalcFim()};
  }
  function commitPlan(){
    if(!canPlan)return true;
    const d={proj:$('#tProj').value,titulo:$('#tTit').value.trim(),desc:$('#tDesc').value.trim(),resp:$('#tResp').value,prio:+$('#tPrio').value,ini:$('#tIni').value,fim:$('#tFim').value};
    if(!d.proj){$('#tProj').focus();toast('Escolha o projeto');return false}
    if(!d.titulo){$('#tTit').focus();toast('Dê um título à tarefa');return false}
    if(d.ini&&d.fim&&d.fim<d.ini){toast('O término não pode ser antes do início');return false}
    if(d.ini&&!d.fim)d.fim=d.ini;
    if(isNew){Object.assign(t,d,{id:uid('k'),criadoEm:nowStamp(),iniBase:d.ini,fimBase:d.fim});log(t,'criacao','Criou a tarefa'+(d.resp?' e atribuiu a '+uname(d.resp):''));S.tarefas.push(t);return true}
    const ch=[];
    if(d.resp!==t.resp){log(t,'resp',t.resp?'Redistribuiu de '+uname(t.resp)+' para '+uname(d.resp):'Atribuiu a '+uname(d.resp),t.onde?'Onde parei, no momento da troca: '+t.onde:'')}
    if(d.prio!==t.prio)log(t,'prio','Prioridade: '+PRIO[t.prio]+' → '+PRIO[d.prio]);
    if(d.ini!==t.ini||d.fim!==t.fim){if(!t.iniBase&&!t.fimBase){t.iniBase=d.ini;t.fimBase=d.fim;log(t,'prazo','Programou para '+br(d.ini)+' a '+br(d.fim))}
      else log(t,'prazo','Alterou o previsto de '+br(t.ini)+'–'+br(t.fim)+' para '+br(d.ini)+'–'+br(d.fim))}
    if(d.titulo!==t.titulo||d.desc!==t.desc||d.proj!==t.proj)ch.push('dados');
    Object.assign(t,d);if(ch.length)log(t,'edicao','Editou os dados da tarefa');return true}
  function commitExec(silent){
    if(!$('#tOnde')||$('#tOnde').disabled)return;
    const onde=$('#tOnde').value.trim(),pend=$('#tPend').value.trim(),ir=$('#tIniR').value,fr=$('#tFimR').value;
    if(onde!==t.onde||pend!==t.pend){t.onde=onde;t.pend=pend;t.atualEm=nowStamp();t.atualPor=S.me;log(t,'andamento','Registrou andamento',onde+(pend?'\nPendências: '+pend:''))}
    if(ir!==t.iniReal){if(t.iniReal||ir)log(t,'datas','Início real: '+brY(ir));t.iniReal=ir}
    if(fr!==t.fimExec){if(t.fimExec||fr)log(t,'datas','Conclusão da execução: '+brY(fr));t.fimExec=fr}
  }
  const finish=(msg,reopen)=>{save();render();if(reopen)openTask(t.id);else dlg.close();if(msg)toast(msg)};
  if($('#tSave'))$('#tSave').onclick=()=>{if(!commitPlan())return;commitExec();finish(isNew?'Tarefa criada':'Tarefa salva')};
  if($('#tSaveNext'))$('#tSaveNext').onclick=()=>{if(!commitPlan())return;const keep={proj:t.proj,resp:t.resp,prio:t.prio,ini:t.fim?addWd(addI(t.fim,1),1,daysOf(t.resp)):''};save();render();toast('Tarefa criada. Preencha a próxima.');openTask(null,keep)};
  if($('#tDel'))$('#tDel').onclick=()=>{$('#delZone').innerHTML='<span class="actions small">Excluir de vez? <button class="btn danger sm" type="button" id="tDel2">Sim, excluir</button></span>';
    $('#tDel2').onclick=()=>{S.tarefas=S.tarefas.filter(x=>x.id!==t.id);finish('Tarefa excluída')}};
  if($('#aStart'))$('#aStart').onclick=()=>{if(!commitPlan())return;commitExec();const was=t.sit;if(!t.iniReal)t.iniReal=TODAY;t.sit='andamento';log(t,'situacao',was==='devolvida'?'Retomou após devolução':'Iniciou a execução');finish(was==='devolvida'?'Tarefa retomada':'Início registrado',true)};
  if($('#aSave'))$('#aSave').onclick=()=>{if(!commitPlan())return;commitExec();finish('Andamento salvo',true)};
  if($('#aSend'))$('#aSend').onclick=()=>{if(!$('#tOnde').value.trim()){$('#tOnde').focus();toast('Descreva o que foi feito antes de enviar');return}
    if(!commitPlan())return;if(!$('#tFimR').value)$('#tFimR').value=TODAY;commitExec();t.sit='conferencia';log(t,'situacao','Enviou para conferência');finish('Enviada para conferência')};
  if($('#aApprove'))$('#aApprove').onclick=()=>{if(!commitPlan())return;commitExec();t.sit='concluida';t.aprovEm=nowStamp();t.aprovPor=S.me;if(!t.fimExec)t.fimExec=TODAY;log(t,'aprovacao','Aprovou e concluiu a tarefa');finish('Tarefa aprovada e concluída')};
  if($('#aReturn'))$('#aReturn').onclick=()=>{$('#retZone').innerHTML='<div class="f" style="margin-top:10px"><label for="retTx">Orientações para correção</label><textarea id="retTx" rows="3" placeholder="O que precisa ser ajustado"></textarea></div><div class="actions" style="margin-top:8px"><button class="btn danger" type="button" id="retOk">Devolver ao colaborador</button></div>';
    $('#retTx').focus();$('#retOk').onclick=()=>{const tx=$('#retTx').value.trim();if(!tx){$('#retTx').focus();toast('Escreva as orientações');return}
      if(!commitPlan())return;commitExec();t.sit='devolvida';t.fimExec='';log(t,'devolucao','Devolveu para ajustes',tx);finish('Tarefa devolvida')}};
  if($('#aReopen'))$('#aReopen').onclick=()=>{t.sit='andamento';t.aprovEm='';t.aprovPor='';log(t,'situacao','Reabriu a tarefa');finish('Tarefa reaberta',true)};
  if(!dlg.open)dlg.showModal();
  setTimeout(()=>{if(focus==='send'||focus==='onde'){const o=$('#tOnde');if(o){o.focus();o.setSelectionRange(o.value.length,o.value.length)}}else if(isNew&&$('#tProj')&&!t.proj)$('#tProj').focus();else if(isNew&&$('#tMod'))$('#tMod').focus()},30);
}
// próximo dia livre do responsável (depois da última tarefa aberta)
function nextFree(uidv){if(!uidv)return '';const L=S.tarefas.filter(t=>t.resp===uidv&&t.sit!=='concluida'&&t.sit!=='conferencia'&&t.fim);
  const last=L.reduce((m,t)=>t.fim>m?t.fim:m,addI(TODAY,-1));return addWd(addI(last,1),1,daysOf(uidv))}

function openProj(id){
  const isNew=!id;const p=id?PR(id):{id:'',codigo:'',nome:'',cli:'',emp:'',disc:'',tipo:'',resp:S.me,ini:'',fim:'',est:'',sit:'aguardando',motivo:'',obs:'',hist:[]};
  const dlg=document.getElementById('dlg'),f=document.getElementById('dlgForm');
  const ts=isNew?[]:projTasks(p.id).sort((a,b)=>(a.ini||'9')<(b.ini||'9')?-1:1);
  let h='<div class="dlg-h"><div><div class="ctx">'+(isNew?'Cliente › Empreendimento › Projeto':esc(CL(p.cli)?.nome)+' › '+esc(EM(p.emp)?.nome))+'</div><h2>'+(isNew?'Novo projeto':esc(projLabel(p)))+'</h2></div><button class="btn x" value="cancel" aria-label="Fechar">✕</button></div><div class="dlg-b">'+

   '<div class="f"><label for="pEmp">Empreendimento</label><select id="pEmp"></select><input id="pEmpNew" placeholder="Nome do novo empreendimento" hidden></div>'+
   '<div class="f"><label for="pCod">Código</label><input id="pCod" value="'+esc(p.codigo)+'" readonly tabindex="-1" style="background:var(--weekend);font-family:var(--f-mono)" placeholder="gerado automaticamente"><span class="help">Sigla do empreendimento + código da disciplina.</span></div>'+
   '<div class="f"><label for="pNome">Nome do projeto</label><input id="pNome" value="'+esc(p.nome)+'" placeholder="ex.: Abastecimento de água"></div>'+

   '<div class="f"><label for="pTipo">Tipo de projeto</label><select id="pTipo">'+opts(S.tipos.map(d=>[d.id,d.nome]),p.tipo,'Selecione…')+'</select></div>'+
   '<div class="f"><label for="pResp">Responsável pelo projeto</label><select id="pResp">'+opts(ativos().map(u=>[u.id,u.nome]),p.resp,'—')+'</select></div>'+
   '<div class="f"><label for="pSit">Situação</label><select id="pSit">'+opts(Object.entries(SIT_P),p.sit)+'</select></div>'+
   '<div class="f full" id="pMotWrap"'+(p.sit==='parado'?'':' hidden')+'><label for="pMot">Motivo da paralisação</label><input id="pMot" value="'+esc(p.motivo)+'"></div>'+
   '</div><div class="fg c3" style="margin-top:10px">'+
   '<div class="f"><label for="pIni">Início previsto</label><input id="pIni" type="date" value="'+p.ini+'"></div>'+
   '<div class="f"><label for="pFim">Prazo de entrega</label><input id="pFim" type="date" value="'+p.fim+'"></div>'+
   '<div class="f"><label for="pEst">Estimativa (d.u.)</label><input id="pEst" type="number" min="1" value="'+esc(p.est)+'"><span class="help" id="pLs"></span></div>'+
   '<div class="f full"><label for="pObs">Observações</label><textarea id="pObs" rows="2">'+esc(p.obs)+'</textarea></div>'+
   '</div></section>';
  if(!isNew){
    h+='<section class="sec"><h4>Tarefas do projeto <span class="sp" style="flex:1"></span><button class="btn sm" type="button" id="pFromMod">+ A partir de modelos</button><button class="btn sm primary" type="button" id="pNewT">+ Tarefa</button></h4><div id="modZone"></div>'+
      (ts.length?'<div class="tblwrap"><table><thead><tr><th>Tarefa</th><th>Responsável</th><th class="n">Previsto</th><th>Situação</th></tr></thead><tbody>'+ts.map(t=>'<tr class="click" data-t="'+t.id+'"><td><b>'+esc(t.titulo)+'</b></td><td>'+esc(uname(t.resp))+'</td><td class="n">'+br(t.ini)+'–'+br(t.fim)+'</td><td>'+sitPill(t.sit)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small muted" style="margin:0">Nenhuma tarefa ainda. Use os modelos para criar a sequência de uma vez.</p>')+'</section>';
    h+='<section class="sec"><h4>Histórico do projeto</h4><ul class="hist">'+[...p.hist].reverse().map(x=>'<li><time>'+brTs(x.ts)+'</time><b>'+esc(uname(x.u))+'</b> — '+esc(x.txt)+(x.det?'<span class="tx">'+esc(x.det)+'</span>':'')+'</li>').join('')+'</ul></section>';
  }
  h+='</div><div class="dlg-f">'+(isNew?'':'<span id="pDelZone"><button class="btn danger" type="button" id="pDel">Excluir</button></span>')+'<span class="sp"></span><button class="btn" value="cancel">Cancelar</button><button class="btn primary" type="button" id="pSave">'+(isNew?'Criar projeto':'Salvar')+'</button></div>';
  f.innerHTML=h;const $=s=>f.querySelector(s);

    $('#pEmp').innerHTML=opts(L.map(e=>[e.id,e.nome+(c?'':' ('+(CL(e.cli)?.sigla||CL(e.cli)?.nome||'')+')')]),p.emp,'Selecione…')+'<option value="__new">+ Cadastrar novo empreendimento</option>'};
  fillEmp();
  $('#pCli').onchange=()=>{$('#pCliNew').hidden=$('#pCli').value!=='__new';if(!$('#pCliNew').hidden)$('#pCliNew').focus();p.emp='';fillEmp()};
  $('#pEmp').onchange=()=>{const v=$('#pEmp').value;$('#pEmpNew').hidden=v!=='__new';if(v==='__new'){$('#pEmpNew').focus();return}
    const e=EM(v);if(e&&$('#pCli').value!==e.cli){$('#pCli').value=e.cli;p.emp=v;fillEmp()}};
  const updCode=()=>{const e=$('#pEmp').value,d=$('#pDisc').value;
    if(!isNew&&e===p.emp&&d===p.disc){$('#pCod').value=p.codigo;return}
    const dd=DI(d);const ns=sugEmpSigla($('#pEmpNew').value);$('#pCod').value=dd?(e==='__new'?(ns?ns+'-':'')+dd.sigla:projCode(e,d,p.id)):'';

  $('#pDisc').addEventListener('change',updCode);$('#pEmp').addEventListener('change',updCode);$('#pCli').addEventListener('change',updCode);$('#pEmpNew').addEventListener('input',updCode);

  $('#pFim').onchange=lsUpd;$('#pEst').oninput=lsUpd;lsUpd();

    if(!emp){$('#pEmp').focus();toast('Escolha o empreendimento');return false}
    if(EM(emp).cli!==cli){toast('Esse empreendimento pertence a outro cliente');return false}
    const d={cli,emp,codigo:(!isNew&&emp===p.emp&&$('#pDisc').value===p.disc)?p.codigo:projCode(emp,$('#pDisc').value,p.id),nome:$('#pNome').value.trim(),disc:$('#pDisc').value,tipo:$('#pTipo').value,resp:$('#pResp').value,ini:$('#pIni').value,fim:$('#pFim').value,est:$('#pEst').value,obs:$('#pObs').value.trim()};
    const sit=$('#pSit').value,mot=$('#pMot').value.trim();
    if(!d.nome){$('#pNome').focus();toast('Dê um nome ao projeto');return false}
    if(!d.disc){$('#pDisc').focus();toast('Escolha a disciplina');return false}
    if(sit==='parado'&&!mot){$('#pMot').focus();toast('Informe o motivo da paralisação');return false}
    if(isNew){Object.assign(p,d,{id:uid('p'),sit,motivo:sit==='parado'?mot:''});log(p,'criacao','Criou o projeto');S.projetos.push(p)}
    else{if(d.fim!==p.fim)log(p,'prazo','Prazo de entrega: '+brY(p.fim)+' → '+brY(d.fim));if(d.resp!==p.resp)log(p,'resp','Responsável: '+uname(p.resp)+' → '+uname(d.resp));
      Object.assign(p,d);if(sit!==p.sit||(sit==='parado'&&mot!==p.motivo)){p.motivo=mot;if(sit!==p.sit)setProjSit(p,sit,mot)}}

    $('#modZone').innerHTML='<div class="fg" style="margin-bottom:10px"><div class="f full"><span class="lbl">Modelos, na ordem de execução</span><div class="checklist">'+S.modelos.map(m=>'<label><input type="checkbox" value="'+m.id+'"> '+esc(m.titulo)+' <span class="muted mono small">'+m.dur+' d.u.</span></label>').join('')+'</div></div>'+
      '<div class="f"><label for="mResp">Responsável</label><select id="mResp">'+opts(ativos().map(u=>[u.id,u.nome]),p.resp)+'</select></div>'+
      '<div class="f"><label for="mIni">Começar em</label><input id="mIni" type="date" value="'+(nextFree(p.resp)||TODAY)+'"></div>'+
      '<div class="f full"><div class="actions"><button class="btn primary" type="button" id="mGo">Criar tarefas em sequência</button><span class="small muted">As datas são encadeadas pelos dias de trabalho do responsável.</span></div></div></div>';
    $('#mResp').onchange=()=>{$('#mIni').value=nextFree($('#mResp').value)||TODAY};
    $('#mGo').onclick=()=>{const ids=[...f.querySelectorAll('.checklist input:checked')].map(i=>i.value);if(!ids.length){toast('Marque ao menos um modelo');return}
      if(!commit())return;const r=$('#mResp').value,dd=daysOf(r);let cur=addWd($('#mIni').value,1,dd);
      ids.forEach(mid=>{const m=byId(S.modelos,mid);const fim=addWd(cur,m.dur,dd);
        const t=Object.assign(blankTask(),{id:uid('k'),proj:p.id,titulo:m.titulo,desc:m.desc,resp:r,prio:3,ini:cur,fim,iniBase:cur,fimBase:fim,criadoEm:nowStamp()});
        log(t,'criacao','Criou a tarefa (modelo) e atribuiu a '+uname(r));S.tarefas.push(t);cur=addWd(addI(fim,1),1,dd)});
      save();render();openProj(p.id);toast(ids.length+' tarefas criadas')}};
  if(!dlg.open)dlg.showModal();
}

// PLANEJAMENTO — Gantt e calendário
// =====================================================================
let PL={mode:'gantt',cal:'mes',anchor:TODAY,zoom:'5',f:{user:'',proj:'',emp:'',disc:'',sit:'abertas'}};
function planTasks(){const F=PL.f;return visibleTasks().filter(t=>{const p=PR(t.proj);
  if(F.user&&t.resp!==F.user)return false;if(F.proj&&t.proj!==F.proj)return false;if(F.emp&&p?.emp!==F.emp)return false;if(F.disc&&p?.disc!==F.disc)return false;
  if(F.sit==='abertas'&&t.sit==='concluida')return false;if(F.sit&&F.sit!=='abertas'&&t.sit!==F.sit)return false;return true})}
function planDeadlines(){const F=PL.f;return S.projetos.filter(p=>p.fim&&(!F.proj||p.id===F.proj)&&(!F.emp||p.emp===F.emp)&&(!F.disc||p.disc===F.disc)&&
  (isCoord()?(!F.user||p.resp===F.user||projTasks(p.id).some(t=>t.resp===F.user)):projTasks(p.id).some(t=>t.resp===S.me)))}
function planUsers(){if(!isCoord())return [me()];return ativos().filter(u=>!PL.f.user||u.id===PL.f.user)}
function renderPlan(el){
  const coord=isCoord();const F=PL.f;
  let h='<div class="toolbar"><div class="seg" role="group" aria-label="Visualização"><button data-m="gantt" aria-pressed="'+(PL.mode==='gantt')+'">Gantt</button><button data-m="cal" aria-pressed="'+(PL.mode==='cal')+'">Calendário</button></div>';
  if(PL.mode==='cal')h+='<div class="seg" role="group" aria-label="Período"><button data-c="dia" aria-pressed="'+(PL.cal==='dia')+'">Dia</button><button data-c="semana" aria-pressed="'+(PL.cal==='semana')+'">Semana</button><button data-c="mes" aria-pressed="'+(PL.cal==='mes')+'">Mês</button></div>';
  else h+='<div class="seg" role="group" aria-label="Zoom"><button data-z="5" aria-pressed="'+(PL.zoom==='5')+'">5 semanas</button><button data-z="13" aria-pressed="'+(PL.zoom==='13')+'">3 meses</button></div>';
  h+='<button class="btn" id="plPrev" aria-label="Anterior">◀</button><button class="btn" id="plHoje">Hoje</button><button class="btn" id="plNext" aria-label="Próximo">▶</button><span class="range" id="plRange"></span><span class="sp"></span>'+(coord?'<button class="btn primary" id="plNova">+ Nova tarefa</button>':'')+'</div>';
  h+='<div class="toolbar" style="margin-top:0">'+
    (coord?'<select id="fUser" aria-label="Colaborador">'+opts(ativos().map(u=>[u.id,u.nome]),F.user,'Toda a equipe')+'</select>':'<span class="small muted">Sua programação</span>')+
    '<select id="fEmp" aria-label="Empreendimento">'+opts(S.emps.map(e=>[e.id,e.nome]),F.emp,'Todos os empreendimentos')+'</select>'+
    '<select id="fProj" aria-label="Projeto">'+opts(S.projetos.filter(p=>!F.emp||p.emp===F.emp).map(p=>[p.id,projLabel(p)]),F.proj,'Todos os projetos')+'</select>'+
    '<select id="fDisc" aria-label="Disciplina">'+opts(S.discs.map(d=>[d.id,d.nome]),F.disc,'Todas as disciplinas')+'</select>'+
    '<select id="fSit" aria-label="Situação"><option value="abertas"'+(F.sit==='abertas'?' selected':'')+'>Sem as concluídas</option><option value=""'+(F.sit===''?' selected':'')+'>Todas as situações</option>'+SIT_T_ORD.map(s=>'<option value="'+s+'"'+(F.sit===s?' selected':'')+'>'+SIT_T[s]+'</option>').join('')+'</select>'+
    '</div><div class="card" id="plBody"></div><div class="legend" id="plLegend"></div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{PL.mode=b.dataset.m;renderMain()});
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{PL.cal=b.dataset.c;renderMain()});
  el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{PL.zoom=b.dataset.z;renderMain()});
  const step=()=>PL.mode==='gantt'?(PL.zoom==='5'?7:28):PL.cal==='dia'?1:PL.cal==='semana'?7:0;
  const mv=dir=>{if(PL.mode==='cal'&&PL.cal==='mes'){const d=parse(PL.anchor);PL.anchor=iso(new Date(d.getFullYear(),d.getMonth()+dir,1))}else PL.anchor=addI(PL.anchor,dir*step());renderPlanBody()};
  el.querySelector('#plPrev').onclick=()=>mv(-1);el.querySelector('#plNext').onclick=()=>mv(1);el.querySelector('#plHoje').onclick=()=>{PL.anchor=TODAY;renderPlanBody()};
  const nv=el.querySelector('#plNova');if(nv)nv.onclick=()=>openTask(null,{resp:F.user||''});
  [['fUser','user'],['fEmp','emp'],['fProj','proj'],['fDisc','disc'],['fSit','sit']].forEach(([i,k])=>{const s=el.querySelector('#'+i);if(s)s.onchange=()=>{F[k]=s.value;if(k==='emp')F.proj='';renderMain()}});
  renderPlanBody();
}
function renderPlanBody(){
  const body=document.getElementById('plBody');if(!body)return;
  if(PL.mode==='gantt')renderGantt(body);else if(PL.cal==='mes')renderMonth(body);else if(PL.cal==='semana')renderWeek(body);else renderDay(body);
  const used=[...new Set(planTasks().map(t=>PR(t.proj)?.cli))].filter(Boolean);
  document.getElementById('plLegend').innerHTML=used.map(c=>'<span><i class="sw" style="background:'+cliVar(c)+'"></i>'+esc(CL(c)?.nome)+'</span>').join('')+
    '<span><i class="sw" style="border:1.5px dashed var(--muted)"></i>pendente (planejada)</span><span><i class="sw" style="background:var(--line);box-shadow:0 0 0 2px var(--s-devolvida) inset"></i>devolvida</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--s-conferencia) 3px 5px)"></i>em conferência</span><span>borda esquerda = prioridade</span>'+
    (PL.mode==='gantt'?'<span><i class="sw" style="background:var(--load0)"></i>dia livre</span><span><i class="sw" style="background:var(--load2)"></i>tarefas sobrepostas</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--off) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>não trabalha</span>':'<span style="color:var(--bad)">⚑ entrega de projeto</span>');
}
const activeOn=(t,d)=>{const r=tRange(t);return r&&r[0]<=d&&d<=r[1]&&daysOf(t.resp).includes(parse(d).getDay())};
function laneLayout(list){const lanes=[];list.sort((a,b)=>tRange(a)[0]<tRange(b)[0]?-1:1);
  list.forEach(a=>{const[s,e]=tRange(a);let i=lanes.findIndex(end=>end<s);if(i<0){i=lanes.length;lanes.push(e)}else lanes[i]=e;a._lane=i});return Math.max(1,lanes.length)}
function renderGantt(body){
  const N=PL.zoom==='5'?35:91,col=PL.zoom==='5'?34:15;
  const v0=addI(monday(PL.anchor),-7),v1=addI(v0,N-1);
  const days=[...Array(N)].map((_,i)=>addI(v0,i));
  document.getElementById('plRange').textContent=br(v0)+' a '+brY(v1);
  const tasks=planTasks();const users=planUsers();
  let h='<div class="gwrap"><div class="gantt" style="--col:'+col+'px;grid-template-columns:var(--namew) repeat('+N+',var(--col))">';
  h+='<div class="namecell gh" style="grid-row:1/3;z-index:4;border-top:none"><small>COLABORADOR</small></div>';
  let i=0;while(i<N){const m=parse(days[i]).getMonth();let j=i;while(j<N&&parse(days[j]).getMonth()===m)j++;
    h+='<div class="month gh" style="grid-column:'+(i+2)+'/'+(j+2)+';grid-row:1">'+(j-i>=3?MES[m]:'')+'</div>';i=j}
  days.forEach((d,k)=>{const wd=parse(d).getDay(),we=wd===0||wd===6;
    h+='<div class="cellh gh'+(we?' we':'')+(d===TODAY?' td':'')+'" style="grid-column:'+(k+2)+';grid-row:2">'+(col>20?pad(parse(d).getDate())+'<br>'+WD[wd]:(parse(d).getDate()%2||N<40?pad(parse(d).getDate()):'&nbsp;'))+'</div>'});
  const ti=diffD(v0,TODAY);
  const bg=(cls)=>days.map(d=>{const wd=parse(d).getDay();return '<div class="daycell'+(wd===0||wd===6?' we':'')+(cls?cls(d,wd):'')+'"></div>'}).join('');
  // linha de entregas
  const dls=planDeadlines().filter(p=>p.fim>=v0&&p.fim<=v1);let row=3;
  if(dls.length){
    const lanes=[];dls.sort((a,b)=>a.fim<b.fim?-1:1).forEach(p=>{const s=diffD(v0,p.fim);const w=Math.ceil(((p.codigo||p.nome).length*7+16)/col);let li=lanes.findIndex(e=>e<s);if(li<0){li=lanes.length;lanes.push(s+w)}else lanes[li]=s+w;p._lane=li});
    const hg=Math.max(44,lanes.length*20+8);
    h+='<div class="namecell" style="grid-row:'+row+';height:'+hg+'px"><b style="font-size:13px">Entregas</b><small>prazos dos projetos</small></div><div class="rowbg flagrow" style="grid-column:2/-1;grid-row:'+row+';height:'+hg+'px;grid-template-columns:repeat('+N+',var(--col))">'+bg()+
      dls.map(p=>'<span class="fl'+(p.sit==='finalizado'?' done':'')+'" data-p="'+p.id+'" title="'+esc(projLabel(p)+' — entrega '+brY(p.fim))+'" style="left:calc('+diffD(v0,p.fim)+' * var(--col) + var(--col)/2 - 5px);top:'+(4+p._lane*20)+'px">'+esc(p.codigo||p.nome)+'</span>').join('')+'</div>';row++}
  users.forEach(u=>{
    const mine=tasks.filter(t=>t.resp===u.id&&tRange(t)).filter(t=>{const[s,e]=tRange(t);return e>=v0&&s<=v1});
    const lanes=laneLayout(mine);const hg=lanes*34+14;
    const openAll=S.tarefas.filter(t=>t.resp===u.id&&openSit(t.sit)&&tRange(t));
    h+='<div class="namecell" style="grid-row:'+row+';height:'+hg+'px"><b>'+esc(u.nome)+'</b><small>'+u.dias.map(x=>WDL[x]).join(' ')+' · '+u.horas+'h</small></div>';
    h+='<div class="rowbg" style="grid-column:2/-1;grid-row:'+row+';height:'+hg+'px;grid-template-columns:repeat('+N+',var(--col))">'+bg((d,wd)=>u.dias.includes(wd)?'':' off');
    if(ti>=0&&ti<N)h+='<div class="todayline" style="left:calc('+ti+' * var(--col) + var(--col)/2 - 1px)"></div>';
    days.forEach((d,k)=>{if(!u.dias.includes(parse(d).getDay())||d<TODAY)return;const n=openAll.filter(t=>activeOn(t,d)).length;
      h+='<div class="load l'+Math.min(n,2)+'" title="'+br(d)+': '+(n?n+' tarefa'+(n>1?'s':''):'livre')+'" style="left:calc('+k+' * var(--col));width:var(--col)"></div>'});
    mine.forEach(t=>{const[s,e]=tRange(t);const si=Math.max(0,diffD(v0,s)),ei=Math.min(N-1,diffD(v0,e));const w=ei-si+1;const p=PR(t.proj);
      h+='<div class="bar '+t.sit+(tVencida(t)?' late':'')+'" tabindex="0" role="button" data-t="'+t.id+'" title="'+esc(t.titulo+' — '+projLabel(p)+' ('+SIT_T[t.sit]+', '+br(s)+' a '+br(e)+')')+'" style="--prio:'+prioVar(t.prio)+';background-color:'+cliVar(p?.cli)+';left:calc('+si+' * var(--col) + 2px);width:calc('+w+' * var(--col) - 4px);top:'+(4+t._lane*34)+'px">'+
        '<span class="t">'+(t.sit==='concluida'?'✓ ':'')+esc(t.titulo)+'</span>'+(w*col>170?'<span class="s">'+esc(p?.codigo||'')+'</span>':'')+'</div>'});
    h+='</div>';row++});
  if(!users.length)h+='<div class="empty" style="grid-column:1/-1">Nenhum colaborador.</div>';
  h+='</div></div>';
  body.innerHTML=h;
  body.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>openTask(b.dataset.t);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTask(b.dataset.t)}}});
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(isCoord())openProj(b.dataset.p)});
}
function chip(t,showIni){const p=PR(t.proj);return '<button class="ch '+t.sit+'" data-t="'+t.id+'" title="'+esc(t.titulo+' — '+projLabel(p)+' — '+uname(t.resp)+' ('+SIT_T[t.sit]+')')+'" style="--prio:'+prioVar(t.prio)+';background:'+cliVar(p?.cli)+'">'+(showIni?'<span class="ini">'+esc(ini2(uname(t.resp)))+'</span>':'')+'<span>'+esc(t.titulo)+'</span></button>'}
function dlChip(p){return '<button class="ch dl" data-p="'+p.id+'" title="Entrega: '+esc(projLabel(p))+'">⚑ <span>'+esc(p.codigo||p.nome)+'</span></button>'}
function calCell(d,inMonth,max,showIni){
  const T=planTasks().filter(t=>activeOn(t,d)).sort(sortT);const P=planDeadlines().filter(p=>p.fim===d);
  const items=P.map(dlChip).concat(T.map(t=>chip(t,showIni)));
  const lim=max||99;
  return '<div class="day'+(inMonth?'':' out')+(d===TODAY?' td':'')+'"><div class="dn"><b>'+parse(d).getDate()+'</b>'+(T.length>1&&isCoord()&&!PL.f.user?'<span class="small" title="tarefas no dia">'+T.length+'</span>':'')+'</div>'+
    items.slice(0,lim).join('')+(items.length>lim?'<button class="more" data-day="'+d+'">+'+(items.length-lim)+' mais</button>':'')+'</div>'}
function renderMonth(body){
  const a=parse(PL.anchor);const first=iso(new Date(a.getFullYear(),a.getMonth(),1));const last=iso(new Date(a.getFullYear(),a.getMonth()+1,0));
  document.getElementById('plRange').textContent=MES[a.getMonth()]+' de '+a.getFullYear();
  let d=monday(first);const end=addI(monday(last),6);
  let h='<div class="tblwrap"><div class="cal" style="min-width:640px">'+['seg','ter','qua','qui','sex','sáb','dom'].map(x=>'<div class="hd">'+x+'</div>').join('');
  const showIni=isCoord()&&!PL.f.user;
  while(d<=end){h+=calCell(d,d>=first&&d<=last,4,showIni);d=addI(d,1)}
  body.innerHTML=h+'</div></div>';bindCal(body);
}
function renderWeek(body){
  const m=monday(PL.anchor);document.getElementById('plRange').textContent=br(m)+' a '+brY(addI(m,6));
  const showIni=isCoord()&&!PL.f.user;
  let h='<div class="tblwrap"><div class="cal week" style="min-width:760px">';
  for(let i=0;i<7;i++){const d=addI(m,i);h+='<div class="hd">'+WDL[parse(d).getDay()]+' '+br(d)+'</div>'}
  for(let i=0;i<7;i++)h+=calCell(addI(m,i),true,0,showIni).replace('<div class="dn"><b>'+parse(addI(m,i)).getDate()+'</b>','<div class="dn"><b></b>');
  body.innerHTML=h+'</div></div>';bindCal(body);
}
function renderDay(body){
  const d=PL.anchor,wd=parse(d).getDay();document.getElementById('plRange').textContent=WDL[wd]+', '+brY(d);
  const T=planTasks().filter(t=>activeOn(t,d));const P=planDeadlines().filter(p=>p.fim===d);
  let h='<div class="panel">'+(P.length?'<div class="actions" style="margin-bottom:12px"><span class="lbl">Entregas do dia</span>'+P.map(p=>'<span style="max-width:240px">'+dlChip(p)+'</span>').join('')+'</div>':'')+'<div class="daylist">';
  const free=[];
  planUsers().forEach(u=>{const L=T.filter(t=>t.resp===u.id).sort(sortT);const works=u.dias.includes(wd);
    if(works&&!L.length)free.push(u.nome);
    h+='<div class="dperson"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(u.nome)+'</b>'+(!works?'<span class="small muted">não trabalha neste dia</span>':L.length>1?'<span class="pill warn">'+L.length+' em paralelo</span>':L.length?'':'<span class="pill ok">livre</span>')+'</div>'+
      L.map(t=>chip(t,false).replace('</span></button>','</span></button><div class="small muted" style="margin:-2px 0 4px 6px">'+esc(projLabel(PR(t.proj)))+' · '+SIT_T[t.sit]+(t.fim?' · até '+br(t.fim):'')+'</div>')).join('')+'</div>'});
  h+='</div>'+(isCoord()&&free.length?'<p class="small" style="margin:12px 0 0"><b>Disponíveis para nova atribuição:</b> '+esc(free.join(', '))+'</p>':'')+'</div>';
  body.innerHTML=h;bindCal(body);
}
function bindCal(body){
  body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openTask(b.dataset.t));
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(isCoord())openProj(b.dataset.p)});
  body.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{PL.cal='dia';PL.anchor=b.dataset.day;renderMain()});
}

// =====================================================================
// TAREFAS — lista
// =====================================================================
let TF={cli:'',emp:'',proj:'',resp:'',sit:'abertas',prio:'',q:''};
function renderTarefas(el){
  const coord=isCoord();
  let h='<div class="toolbar"><input id="tfQ" type="search" placeholder="Buscar tarefa ou projeto" value="'+esc(TF.q)+'" style="max-width:240px">'+
    '<select id="tfCli">'+opts(S.clientes.map(c=>[c.id,c.nome]),TF.cli,'Todos os clientes')+'</select>'+
    '<select id="tfEmp">'+opts(S.emps.filter(e=>!TF.cli||e.cli===TF.cli).map(e=>[e.id,e.nome]),TF.emp,'Todos os empreendimentos')+'</select>'+
    '<select id="tfProj">'+projOptions(TF.proj).replace('Selecione o projeto…','Todos os projetos')+'</select>'+
    (coord?'<select id="tfResp">'+opts(ativos().map(u=>[u.id,u.nome]),TF.resp,'Todos os responsáveis')+'</select>':'')+
    '<select id="tfSit"><option value="abertas"'+(TF.sit==='abertas'?' selected':'')+'>Sem as concluídas</option><option value=""'+(TF.sit===''?' selected':'')+'>Todas as situações</option>'+SIT_T_ORD.map(s=>'<option value="'+s+'"'+(TF.sit===s?' selected':'')+'>'+SIT_T[s]+'</option>').join('')+'</select>'+
    '<select id="tfPrio">'+opts(Object.entries(PRIO),TF.prio,'Todas as prioridades')+'</select><span class="sp"></span>'+(coord?'<button class="btn primary" id="tfNova">+ Nova tarefa</button>':'')+'</div>';
  const q=TF.q.toLowerCase();
  const L=visibleTasks().filter(t=>{const p=PR(t.proj);if(TF.cli&&p?.cli!==TF.cli)return false;if(TF.emp&&p?.emp!==TF.emp)return false;if(TF.proj&&t.proj!==TF.proj)return false;if(TF.resp&&t.resp!==TF.resp)return false;if(TF.prio&&t.prio!=TF.prio)return false;
    if(TF.sit==='abertas'&&t.sit==='concluida')return false;if(TF.sit&&TF.sit!=='abertas'&&t.sit!==TF.sit)return false;
    if(q&&!(t.titulo+' '+projLabel(p)+' '+(EM(p?.emp)?.nome||'')).toLowerCase().includes(q))return false;return true}).sort(sortT);
  h+='<div class="card"><div class="tblwrap"><table><thead><tr><th>Prioridade</th><th>Tarefa</th><th>Projeto / empreendimento</th>'+(coord?'<th>Responsável</th>':'')+'<th>Situação</th><th class="n">Previsto</th><th>Onde parei</th></tr></thead><tbody>'+
    (L.length?L.map(t=>{const p=PR(t.proj);return '<tr class="click" data-t="'+t.id+'"><td>'+prioPill(t.prio)+'</td><td><b>'+esc(t.titulo)+'</b></td><td><span class="sw" style="background:'+cliVar(p?.cli)+';vertical-align:-1px"></span> '+esc(projLabel(p))+'<br><span class="small muted">'+esc(EM(p?.emp)?.nome||'')+'</span></td>'+(coord?'<td>'+esc(uname(t.resp))+'</td>':'')+'<td>'+sitPill(t.sit)+'</td><td class="n"'+(tVencida(t)?' style="color:var(--bad);font-weight:600"':'')+'>'+br(t.ini)+'–'+br(t.fim)+'</td><td class="small muted" style="max-width:280px">'+esc((t.onde||'').slice(0,110))+(t.onde&&t.onde.length>110?'…':'')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Nenhuma tarefa com esses filtros.</td></tr>')+'</tbody></table></div></div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-t]').forEach(r=>r.onclick=()=>openTask(r.dataset.t));
  const nv=el.querySelector('#tfNova');if(nv)nv.onclick=()=>openTask(null,{proj:TF.proj,resp:TF.resp});
  [['tfCli','cli'],['tfEmp','emp'],['tfProj','proj'],['tfResp','resp'],['tfSit','sit'],['tfPrio','prio']].forEach(([i,k])=>{const s=el.querySelector('#'+i);if(s)s.onchange=()=>{TF[k]=s.value;if(k==='cli'){TF.emp='';TF.proj=''}if(k==='emp')TF.proj='';renderMain()}});
  const qi=el.querySelector('#tfQ');qi.oninput=()=>{TF.q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{renderMain();const n=document.getElementById('tfQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
}

// =====================================================================
// PROJETOS — lista
// =====================================================================
let PF2={q:'',sit:'',cli:'',resp:''};
function renderProjetos(el){
  let h='<div class="toolbar"><input id="prQ" type="search" placeholder="Buscar cliente, empreendimento ou projeto" value="'+esc(PF2.q)+'" style="max-width:300px"><select id="prCli">'+opts(S.clientes.map(c=>[c.id,c.nome]),PF2.cli,'Todos os clientes')+'</select><select id="prResp">'+opts(ativos().map(u=>[u.id,u.nome]),PF2.resp,'Todos os responsáveis')+'</select><select id="prSit">'+opts(Object.entries(SIT_P),PF2.sit,'Todas as situações')+'</select><span class="sp"></span><button class="btn primary" id="prNovo">+ Novo projeto</button></div>';
  const q=PF2.q.toLowerCase();let rows='';
  S.clientes.filter(c=>!PF2.cli||c.id===PF2.cli).forEach(c=>{S.emps.filter(e=>e.cli===c.id).forEach(e=>{
    const ps=S.projetos.filter(p=>p.emp===e.id&&(!PF2.sit||p.sit===PF2.sit)&&(!PF2.resp||p.resp===PF2.resp)&&(!q||(c.nome+' '+e.nome+' '+projLabel(p)).toLowerCase().includes(q)));if(!ps.length)return;

function weekChart(T){
  const W=8,wk0=addI(monday(TODAY),-7*(W-1));const weeks=[...Array(W)].map((_,i)=>addI(wk0,i*7));
  const data=weeks.map(w=>{const end=addI(w,6);const done=T.filter(t=>t.aprovEm&&t.aprovEm.slice(0,10)>=w&&t.aprovEm.slice(0,10)<=end).length;
    const open=T.filter(t=>(t.criadoEm||'').slice(0,10)<=end&&!(t.aprovEm&&t.aprovEm.slice(0,10)<=end)).length;return {w,done,open}});
  const max=Math.max(1,...data.map(d=>Math.max(d.done,d.open)));const nice=Math.ceil(max/2)*2||2;
  const Wd=560,Hd=200,l=30,r=10,t=12,b=26,cw=(Wd-l-r)/W,sc=v=>t+(Hd-t-b)*(1-v/nice);
  let s='<svg viewBox="0 0 '+Wd+' '+Hd+'" width="100%" role="img" aria-label="Evolução semanal">';
  for(let g=0;g<=nice;g+=nice/2){s+='<line x1="'+l+'" x2="'+(Wd-r)+'" y1="'+sc(g)+'" y2="'+sc(g)+'" style="stroke:var(--line2)"/><text x="'+(l-6)+'" y="'+(sc(g)+3)+'" text-anchor="end" style="fill:var(--muted)">'+g+'</text>'}
  data.forEach((d,i)=>{const x=l+i*cw;s+='<rect x="'+(x+cw*.22)+'" y="'+sc(d.done)+'" width="'+(cw*.56)+'" height="'+(sc(0)-sc(d.done))+'" rx="2" style="fill:var(--s-concluida)"><title>Semana de '+br(d.w)+': '+d.done+' concluídas</title></rect>'+
    '<text x="'+(x+cw/2)+'" y="'+(Hd-8)+'" text-anchor="middle" style="fill:var(--muted)">'+br(d.w)+'</text>'+(d.done?'<text x="'+(x+cw/2)+'" y="'+(sc(d.done)-4)+'" text-anchor="middle" style="fill:var(--fg)">'+d.done+'</text>':'')});
  s+='<polyline fill="none" style="stroke:var(--s-conferencia);stroke-width:2" points="'+data.map((d,i)=>(l+i*cw+cw/2)+','+sc(d.open)).join(' ')+'"/>';
  data.forEach((d,i)=>{s+='<circle cx="'+(l+i*cw+cw/2)+'" cy="'+sc(d.open)+'" r="'+(i===W-1?4:2.5)+'" style="fill:var(--s-conferencia)"><title>Em aberto no fim da semana: '+d.open+'</title></circle>'});
  s+='</svg><div class="legend"><span><i class="sw" style="background:var(--s-concluida)"></i>concluídas na semana</span><span><i class="sw" style="background:var(--s-conferencia)"></i>em aberto no fim da semana</span></div>';
  return s}
function pairChart(done){
  const rows=ativos().map(u=>{const L=done.filter(t=>t.resp===u.id&&t.iniReal&&t.iniBase);if(!L.length)return null;const dd=daysOf(u.id);
    const p=L.reduce((s,t)=>s+wdBetween(t.iniBase,t.fimBase,dd),0)/L.length,r=L.reduce((s,t)=>s+wdBetween(t.iniReal,t.fimExec,dd),0)/L.length;return {u,p,r,n:L.length}}).filter(Boolean);
  if(!rows.length)return '<p class="small muted">Sem tarefas concluídas no filtro.</p>';

   '<div class="legend"><span><i class="sw" style="background:var(--muted)"></i>prevista</span><span><i class="sw" style="background:var(--ok)"></i>realizada (dentro)</span><span><i class="sw" style="background:var(--bad)"></i>realizada (acima)</span></div>'}

function authCard(h){clearView();document.getElementById('tabs').innerHTML='';document.getElementById('whoBox').hidden=true;

function gate(){
  if(FS.status==='unsupported')return;
  if(FS.status==='none'||!FS.locs.length)return showFolder();
  if(FS.status==='ask')return showReconnect();
  if(FS.status==='offline'&&!DATA.users.length)return showOffline();
  if(!DATA.users.length)return showSetup();
  const s=getSess();const u=s&&DATA.users.find(x=>x.id===s.uid);
  if(u&&u.status==='ativo'&&(u.hash||'').slice(-16)===s.hk)return enter(u.id);
  showLogin();
}

async function fsAddLoc(first,fromGate){
  let h;try{h=await window.showDirectoryPicker({id:'polis-hub',mode:'readwrite'})}catch(e){if(!e||e.name!=='AbortError')toast('Não foi possível acessar a pasta');return}
  let mk=null;try{mk=await readJSON(h,'polis-hub.json')}catch(e){}
  if(first){
    if(!mk){let n=0;try{for await(const k of h.keys()){n++;break}}catch(e){}
      if(n&&!confirm('A pasta “'+h.name+'” não tem dados do Polis Hub e não está vazia.\n\nO ideal é usar uma pasta só para o Polis Hub. Criar os dados nela mesmo assim?'))return}
  }else if(MARK&&(!mk||!mk.j||mk.j.id!==MARK.id)){
    if(!confirm('A pasta “'+h.name+'” não é a mesma pasta de dados do Polis Hub que este computador usa.\n\nUm caminho alternativo precisa apontar para a MESMA pasta (ex.: a do escritório vista pelo RaiDrive). Adicionar mesmo assim?'))return}
  const sug=first?'Escritório (rede)':(FS.locs.length===1?'Fora do escritório (RaiDrive)':'Caminho '+(FS.locs.length+1));
  const nome=((typeof prompt==='function'&&prompt('Dê um nome para este caminho:',sug))||sug).trim();
  FS.locs.push({id:uid('l'),nome,h});await idb.set('locs',FS.locs);
  await fsConnect(true);
  if(first||fromGate)return gate();
  toast('Caminho “'+nome+'” adicionado');
}

    '<form id="fAuth"><div class="f"><label for="aE">E-mail</label><input id="aE" type="email" autocomplete="username" required></div><div class="f"><label for="aS">Senha</label><input id="aS" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Entrar</button></form>'+

    '<div class="loginfolder" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span id="loginFolder" class="small" style="flex:1;min-width:180px"></span><button class="btn sm" type="button" id="aPasta">Pasta de dados</button></div>');
  document.getElementById('aPasta').onclick=openPasta;setSync();

    const em=document.getElementById('aE').value.trim().toLowerCase(),pw=document.getElementById('aS').value;
    if(FS.status==='ok'){try{await refresh(false)}catch(x){}}
    const u=DATA.users.find(x=>(x.email||'').toLowerCase()===em);
    if(!u||!(await checkPw(pw,u.hash))){toast(FS.status==='ok'?'E-mail ou senha incorretos':'E-mail ou senha incorretos. Atenção: este computador está sem acesso à pasta de dados, então uma senha trocada ou redefinida ainda não chegou aqui. Conecte a pasta e tente de novo.');return}
    if(u.status==='pendente'){toast('Seu acesso ainda não foi autorizado pela coordenação');return}
    if(u.status!=='ativo'){toast('Seu acesso está desativado. Fale com a coordenação.');return}

  document.getElementById('aReg').onclick=e=>{e.preventDefault();showRegister()};

function showRegister(){
  authCard('<h3>Pedir acesso</h3><p class="small muted" style="margin:4px 0 0">A coordenação recebe o pedido, autoriza e define o seu perfil.</p>'+
    '<form id="fAuth"><div class="f"><label for="rN">Nome</label><input id="rN" autocomplete="name" required></div><div class="f"><label for="rE">E-mail</label><input id="rE" type="email" autocomplete="email" required></div><div class="f"><label for="rS">Senha</label><input id="rS" type="password" autocomplete="new-password" minlength="6" required><span class="help">Mínimo de 6 caracteres.</span></div><div class="f"><label for="rS2">Repita a senha</label><input id="rS2" type="password" autocomplete="new-password" required></div><button class="btn primary" type="submit">Enviar pedido</button></form>'+
    '<p class="small muted" style="margin:16px 0 0"><a href="#" id="aBack">Voltar para entrar</a></p>');
  document.getElementById('aBack').onclick=e=>{e.preventDefault();showLogin()};
  document.getElementById('fAuth').onsubmit=async e=>{e.preventDefault();
    const n=document.getElementById('rN').value.trim(),em=document.getElementById('rE').value.trim().toLowerCase(),pw=document.getElementById('rS').value;
    if(pw!==document.getElementById('rS2').value){toast('As senhas não conferem');return}

    if(DATA.users.some(x=>(x.email||'').toLowerCase()===em)){toast('Já existe um cadastro com esse e-mail');return}
    if(FS.status!=='ok'){toast('Sem acesso à pasta de dados. Tente de novo na rede do escritório.');return}
    const id=uid('u');
    await emit([{c:'users',id,op:'put',set:{nome:n,email:em,perfil:'colab',status:'pendente',dias:[1,2,3,4,5],horas:8,pedidoEm:nowStamp(),hash:await hashPw(pw)}}],id);
    authCard('<h3>Pedido enviado</h3><p class="muted">Assim que a coordenação autorizar, você entra com o seu e-mail e senha.</p><button class="btn primary" type="button" id="aOk">Voltar para entrar</button>');
    document.getElementById('aOk').onclick=()=>showLogin()};
}

  const re=()=>{d.close();openPasta()};

  f.querySelector('#lRe').onclick=async()=>{await fsConnect(true);if(FS.status==='ok'){await poll();toast('Pasta conectada')}else toast(FS.status==='ask'?'A permissão não foi concedida':'A pasta não respondeu por nenhum caminho');re()};
  const bk=f.querySelector('#lBk');if(bk)bk.onclick=exportBackup;
  f.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.up,a=FS.locs;[a[i-1],a[i]]=[a[i],a[i-1]];await idb.set('locs',a);FS.cur=-1;await fsConnect(false);re()});
  f.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm('Remover este caminho? Os dados não são apagados; este computador só deixa de usar esse caminho.'))return;
    FS.locs=FS.locs.filter(x=>x.id!==b.dataset.rm);delete FS.locStatus[b.dataset.rm];await idb.set('locs',FS.locs);FS.cur=-1;await fsConnect(false);re()});
  if(!d.open)d.showModal();
}
document.getElementById('btnSair').onclick=()=>logout();
document.getElementById('btnPasta').onclick=openPasta;
document.getElementById('btnSenha').onclick=()=>{
  const d=document.getElementById('dlg2'),f=document.getElementById('dlg2Form');
  f.innerHTML='<div class="dlg-h"><div><div class="ctx">'+esc(me().nome)+'</div><h2>Trocar minha senha</h2></div></div><div class="dlg-b"><div class="f"><label for="pA">Senha atual</label><input id="pA" type="password" autocomplete="current-password"></div><div class="f"><label for="pN">Nova senha</label><input id="pN" type="password" autocomplete="new-password"></div><div class="f"><label for="pN2">Repita a nova senha</label><input id="pN2" type="password" autocomplete="new-password"></div></div><div class="dlg-f"><span class="sp"></span><button class="btn" value="cancel">Cancelar</button><button class="btn primary" type="button" id="pOk">Trocar senha</button></div>';
  f.querySelector('#pOk').onclick=async()=>{const a=f.querySelector('#pA').value,n=f.querySelector('#pN').value;
    if(n!==f.querySelector('#pN2').value){toast('As senhas novas não conferem');return}
    if(n.length<6){toast('A nova senha precisa ter ao menos 6 caracteres');return}
    const u=DATA.users.find(x=>x.id===S.me);if(!u||!(await checkPw(a,u.hash))){toast('A senha atual não confere');return}
    await emit([{c:'users',id:S.me,op:'put',set:{hash:await hashPw(n)}}],S.me);
    setSess(DATA.users.find(x=>x.id===S.me));d.close();toast('Senha trocada')};
  d.showModal();setTimeout(()=>f.querySelector('#pA').focus(),30);
};
['dlg','dlg2'].forEach(id=>document.getElementById(id).addEventListener('close',()=>{if(pendingRender&&S.me&&!dialogOpen()){pendingRender=false;if(!userStillValid())return logout('Seu acesso foi alterado. Entre de novo.');buildView();render()}}));
(async function boot(){
  if(!('showDirectoryPicker' in window)||!window.isSecureContext){FS.status='unsupported';
    return authCard('<h3>Abra no Google Chrome ou no Microsoft Edge</h3><p class="muted" style="margin:6px 0 0">O Polis Hub grava os dados direto na pasta do servidor, e só esses navegadores permitem isso.</p>')}
  DEVICE=(typeof window.__POLIS_DEV==='string'&&window.__POLIS_DEV)||await idb.get('dev');
  if(!DEVICE){DEVICE=uid('pc');await idb.set('dev',DEVICE)}
  const my=await idb.get('my:'+DEVICE);if(my){MY=my.events||[];MYSEQ=my.seq||0;MYDIRTY=!!my.dirty}
  const cache=await idb.get('cache:'+DEVICE);if(cache){BASE=cache.base||null;EVCACHE=cache.ev||{};MARK=cache.mark||null}
  FS.locs=(await idb.get('locs'))||[];
  rebuild();
  if(!FS.locs.length){FS.status='none';return gate()}
  await fsConnect(false);
  gate();
})();
// app instalável: atualização automática
if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost'){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=()=>{if(document.getElementById('upd'))return;const b=document.createElement('div');b.id='upd';b.className='toast';b.style.display='flex';b.style.gap='10px';b.style.alignItems='center';
      b.innerHTML='Nova versão do Polis Hub disponível <button class="btn sm primary" type="button">Atualizar agora</button>';
      b.querySelector('button').onclick=()=>{if(reg.waiting)reg.waiting.postMessage('skip');else location.reload()};document.body.appendChild(b)};
    if(reg.waiting&&navigator.serviceWorker.controller)show();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)show()})});
    setInterval(()=>reg.update().catch(()=>{}),3600e3);
  }).catch(()=>{});
  let rel=false;if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rel)return;rel=true;location.reload()});
}

})();
